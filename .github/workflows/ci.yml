name: CI
on:
  push:
    branches: [main, develop]
    paths-ignore:
      # Docs-only changes don't affect the build or tests, so skip CI for them.
      - "**.md"
      - "docs/**"
      - "LICENSE*"
      - ".gitignore"
      - "docker-compose.yml"
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE*"
      - ".gitignore"
      - "docker-compose.yml"
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
          cache: npm
      - run: npm ci
      - run: npm test
      - run: docker build -t cs2-rcon-web .
